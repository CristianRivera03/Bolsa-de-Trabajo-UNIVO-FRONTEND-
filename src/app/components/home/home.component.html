<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />


<div class="animate-fade-in p-8">
  
 

  <!-- ========================================== -->
  <!-- SECCIÓN DE FILTROS                         -->
  <!-- ========================================== -->
  <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <h2 class="text-xl font-bold text-base-content flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">work</span>
      Ofertas Recientes
    </h2>

    <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
      <!-- Filtros estilo píldora -->
      <button class="btn btn-sm btn-active rounded-full px-4">Todas</button>
      <button class="btn btn-sm btn-ghost bg-base-200 rounded-full px-4 text-base-content/70 hover:text-primary">Ingeniería</button>
      <button class="btn btn-sm btn-ghost bg-base-200 rounded-full px-4 text-base-content/70 hover:text-primary">Pasantías</button>
      <button class="btn btn-sm btn-ghost bg-base-200 rounded-full px-4 text-base-content/70 hover:text-primary border border-base-300">
        <span class="material-symbols-outlined text-[16px]">tune</span> Filtros
      </button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- GRID DE OFERTAS LABORALES                  -->
  <!-- ========================================== -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 pb-8">
    
    <!-- Iteración de Ofertas con Angular -->
    <div *ngFor="let oferta of ofertas" class="card bg-base-100 shadow-md border border-base-200 hover:border-primary/30 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer group">
      
      <div class="card-body p-6">
        
        <!-- Header de la Tarjeta: Logo y Badge -->
        <div class="flex justify-between items-start mb-4">
          <div class="w-12 h-12 rounded-xl bg-base-200 flex items-center justify-center overflow-hidden border border-base-300 shadow-sm">
            <img [src]="oferta.logo" alt="Logo {{oferta.empresa}}" class="w-full h-full object-cover" />
          </div>
          <!-- Badge dinámico según la modalidad -->
          <div class="badge border-none font-semibold text-xs py-2 shadow-sm" [ngClass]="getModalidadClass(oferta.modalidad)">
            {{ oferta.modalidad }}
          </div>
        </div>

        <!-- Info del Puesto -->
        <h3 class="card-title text-lg font-bold text-base-content leading-tight group-hover:text-primary transition-colors">
          {{ oferta.titulo }}
        </h3>
        <p class="text-sm text-primary font-semibold mb-3">{{ oferta.empresa }}</p>

        <!-- Detalles (Ubicación, Salario, etc) -->
        <div class="space-y-2 mt-2">
          <div class="flex items-center text-xs text-base-content/70 gap-2">
            <span class="material-symbols-outlined text-[16px] opacity-70">location_on</span>
            {{ oferta.ubicacion }}
          </div>
          <div class="flex items-center text-xs text-base-content/70 gap-2">
            <span class="material-symbols-outlined text-[16px] opacity-70">payments</span>
            {{ oferta.salario }}
          </div>
        </div>

        <!-- Footer de la Tarjeta -->
        <div class="card-actions justify-between items-center mt-6 pt-4 border-t border-base-200">
          <span class="text-[11px] text-base-content/50 font-medium flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">schedule</span>
            {{ oferta.fechaPublicacion }}
          </span>
          <button class="btn btn-sm btn-outline btn-primary rounded-lg px-4 opacity-0 group-hover:opacity-100 transition-opacity">
            Ver Detalles
          </button>
        </div>

      </div>
    </div>
    
  </div>
</div>
