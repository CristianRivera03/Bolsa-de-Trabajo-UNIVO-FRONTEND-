<div class="container mx-auto p-4 max-w-4xl animate-fade-in">
  
  <div class="flex items-center gap-4 mb-8">
    <div class="avatar relative group cursor-pointer" (click)="fotoInput.click()">
      <div class="w-20 h-20 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2 overflow-hidden">
        <img [src]="fotoUrl" alt="Avatar" class="object-cover w-full h-full" />
        <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <span class="material-symbols-outlined text-white">photo_camera</span>
        </div>
      </div>
      <input #fotoInput type="file" class="hidden" accept="image/jpeg, image/png, image/webp" (change)="onFotoSelected($event)">
    </div>
    <div>
      <h1 class="text-3xl font-bold text-base-content">Mi Currículum Digital</h1>
      <p class="text-base-content/70">Mantén tu información actualizada para atraer a las mejores empresas.</p>
    </div>
  </div>

  <form [formGroup]="perfilForm" (ngSubmit)="guardarPerfil()" class="space-y-6">
    
    <div class="card bg-base-100 shadow-sm border border-base-200">
      <div class="card-body">
        <h2 class="card-title text-primary border-b pb-2"><span class="material-symbols-outlined">person</span> Datos Personales</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Nombres</span></label>
            <input type="text" formControlName="nombres" class="input input-bordered w-full" />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Apellidos</span></label>
            <input type="text" formControlName="apellidos" class="input input-bordered w-full" />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Teléfono de Contacto</span></label>
            <input type="tel" formControlName="telefono" class="input input-bordered w-full" placeholder="Ej: 77778888" />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Nivel de Idioma (Inglés)</span></label>
            <select formControlName="nivelIdiomaId" class="select select-bordered w-full">
              <option value="" disabled>Seleccione nivel...</option>
              @for (nivel of nivelesIdioma; track nivel.id) {
                <option [value]="nivel.id">{{ nivel.nombre }}</option>
              }
            </select>
          </div>
          
          <div class="form-control col-span-full">
            <label class="label"><span class="label-text font-medium">Dirección de Residencia</span></label>
            <input type="text" formControlName="direccion" class="input input-bordered w-full" placeholder="Ej: Barrio San Francisco, San Miguel..." />
          </div>

          <div class="form-control col-span-full mt-2 p-4 bg-base-200 rounded-lg">
            <label class="cursor-pointer label justify-start gap-4">
              <input type="checkbox" formControlName="buscaEmpleo" class="toggle toggle-primary toggle-lg" />
              <div>
                <span class="label-text font-bold block text-lg">Disponibilidad Laboral</span>
                <span class="label-text-alt text-base-content/70">Activa esto si estás buscando empleo o pasantías activamente.</span>
              </div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 shadow-sm border border-base-200">
      <div class="card-body">
        <h2 class="card-title text-primary border-b pb-2"><span class="material-symbols-outlined">school</span> Formación Académica</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
          <div class="form-control col-span-full">
            <label class="label"><span class="label-text font-medium">Institución</span></label>
            <input type="text" formControlName="universidad" class="input input-bordered w-full bg-base-200" readonly />
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Carrera</span></label>
            <select formControlName="carreraId" class="select select-bordered w-full">
              <option value="" disabled>Seleccione carrera...</option>
              @for (carrera of carreras; track carrera.id) {
                <option [value]="carrera.id">{{ carrera.nombre }}</option>
              }
            </select>
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Estado Académico</span></label>
            <select formControlName="gradoAcademicoId" class="select select-bordered w-full">
              <option value="" disabled>Seleccione estado...</option>
              @for (grado of gradosAcademicos; track grado.id) {
                <option [value]="grado.id">{{ grado.nombre }}</option>
              }
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 shadow-sm border border-base-200">
      <div class="card-body">
        <h2 class="card-title text-primary border-b pb-2"><span class="material-symbols-outlined">work</span> Experiencia y Enlaces Profesionales</h2>
        
        <div class="grid grid-cols-1 gap-4 mt-2">
          <div class="form-control">
            <label class="label">
              <span class="label-text font-medium">Habilidades Técnicas y Blandas</span>
              <span class="label-text-alt opacity-70">Separadas por comas</span>
            </label>
            <input type="text" formControlName="habilidades" class="input input-bordered w-full" placeholder="Ej: C#, Angular, Trabajo en equipo..." />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text font-medium">Experiencia Previa / Pasantías</span>
            </label>
            <textarea formControlName="experienciaPrevia" class="textarea textarea-bordered h-24" placeholder="Describe brevemente tus roles anteriores o pasantías..."></textarea>
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text font-medium">Resumen Profesional (Sobre mí)</span>
            </label>
            <textarea formControlName="sobreMi" class="textarea textarea-bordered h-24" placeholder="Un breve resumen de tu perfil para los reclutadores..."></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-control">
              <label class="label"><span class="label-text font-medium">URL de LinkedIn</span></label>
              <input type="url" formControlName="enlaceLinkedIn" class="input input-bordered w-full" placeholder="https://linkedin.com/in/tu-perfil" />
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text font-medium">URL de GitHub / Portafolio</span></label>
              <input type="url" formControlName="enlaceGitHub" class="input input-bordered w-full" placeholder="https://github.com/tu-usuario" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-end gap-4 pb-10">
      <button type="submit" class="btn btn-primary w-48 shadow-lg" [disabled]="isLoading || perfilForm.invalid">
        @if(isLoading) {
          <span class="loading loading-spinner"></span> Guardando...
        } @else {
          Guardar Perfil
        }
      </button>
    </div>

  </form>
</div>
