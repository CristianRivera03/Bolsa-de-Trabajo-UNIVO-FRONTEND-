<div class="p-6 md:p-10 max-w-4xl mx-auto animate-fade-in">
  
  <div class="flex items-center gap-3 mb-8 border-b border-base-200 pb-4">
    <span class="material-symbols-outlined text-primary text-3xl">post_add</span>
    <div>
      <h2 class="text-2xl font-bold text-base-content">Publicar Nueva Oferta</h2>
      <p class="text-xs text-base-content/60">Atrae al mejor talento de la Universidad de Oriente.</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl border border-base-200">
    <div class="card-body p-6 md:p-8">
      
      <div *ngIf="successMessage" class="alert alert-success bg-success/10 text-success-content border-none rounded-xl mb-6">
        <span class="material-symbols-outlined">check_circle</span>
        <span>{{ successMessage }}</span>
      </div>
      <div *ngIf="errorMessage" class="alert alert-error bg-error/10 text-error-content border-none rounded-xl mb-6">
        <span class="material-symbols-outlined">error</span>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="ofertaForm" (ngSubmit)="publicarOferta()" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        


        <div class="form-control md:col-span-2">
          <label class="label py-1"><span class="label-text font-bold text-xs">Título del Puesto <span class="text-error">*</span></span></label>
          <input formControlName="titulo" type="text" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. Desarrollador Angular Senior" />
        </div>

        <div class="form-control">
          <label class="label py-1"><span class="label-text font-bold text-xs">Ubicación <span class="text-error">*</span></span></label>
          <input formControlName="ubicacion" type="text" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. San Miguel, El Salvador" />
        </div>

        <div class="form-control">
          <label class="label py-1"><span class="label-text font-bold text-xs">Modalidad <span class="text-error">*</span></span></label>
          <select formControlName="modalidadId" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50">
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="1">Presencial</option>
            <option value="2">Remoto</option>
            <option value="3">Híbrido</option>
          </select>
        </div>

        <div class="form-control md:col-span-2">
          <label class="label py-1"><span class="label-text font-bold text-xs">Descripción del Puesto <span class="text-error">*</span></span></label>
          <textarea formControlName="descripcion" class="textarea textarea-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 h-32" placeholder="Describe las responsabilidades, el equipo y la misión del rol..."></textarea>
        </div>

        <div class="form-control md:col-span-2">
          <label class="label py-1"><span class="label-text font-bold text-xs">Requisitos (Habilidades, Experiencia) <span class="text-error">*</span></span></label>
          <textarea formControlName="requisitos" class="textarea textarea-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 h-24" placeholder="Ej. - 3 años de experiencia en .NET..."></textarea>
        </div>

        <div class="form-control">
          <label class="label py-1"><span class="label-text font-bold text-xs">Salario Mínimo (USD)</span></label>
          <input formControlName="salarioMin" type="number" step="0.01" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. 600.00" />
        </div>

        <div class="form-control">
          <label class="label py-1"><span class="label-text font-bold text-xs">Salario Máximo (USD)</span></label>
          <input formControlName="salarioMax" type="number" step="0.01" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. 1000.00" />
          <label *ngIf="ofertaForm.hasError('rangoInvalido')" class="label py-1">
            <span class="label-text-alt text-error">El máximo debe ser mayor al mínimo</span>
          </label>
        </div>

        <div class="form-control md:col-span-2">
          <label class="label py-1"><span class="label-text font-bold text-xs">Fecha de Expiración (Opcional)</span></label>
          <input formControlName="fechaExpiracion" type="date" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 w-full md:w-1/2" />
        </div>

        <div class="md:col-span-2 mt-6 flex justify-end gap-4 border-t border-base-200 pt-6">
          <button type="button" class="btn btn-ghost rounded-xl">Cancelar</button>
          <button type="submit" class="btn btn-primary rounded-xl px-8 shadow-lg shadow-primary/30" [disabled]="ofertaForm.invalid || isLoading">
            <span *ngIf="isLoading" class="loading loading-spinner"></span>
            Publicar Vacante
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
