<div class="p-6 md:p-10 max-w-4xl mx-auto animate-fade-in">
  
  <div class="flex items-center gap-3 mb-8 border-b border-base-200 pb-4">
    <span class="material-symbols-outlined text-primary text-3xl">post_add</span>
    <div>
      <h2 class="text-2xl font-bold text-base-content">Publicar Nueva Oferta</h2>
      <p class="text-xs text-base-content/60">Atrae al mejor talento de la Universidad de Oriente.</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl border border-base-200">
    <div class="card-body p-6 md:p-8">
      
      <div *ngIf="successMessage" class="alert alert-success bg-success/10 text-success-content border-none rounded-xl mb-6">
        <span class="material-symbols-outlined">check_circle</span>
        <span>{{ successMessage }}</span>
      </div>
      <div *ngIf="errorMessage" class="alert alert-error bg-error/10 text-error-content border-none rounded-xl mb-6">
        <span class="material-symbols-outlined">error</span>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="ofertaForm" (ngSubmit)="publicarOferta()" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="form-control md:col-span-2">
          <label for="titulo" class="label py-1"><span class="label-text font-bold text-xs">Título del Puesto <span class="text-error">*</span></span></label>
          <input id="titulo" formControlName="titulo" type="text" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. Desarrollador Angular Senior" title="Título del Puesto" />
        </div>

        <div class="form-control">
          <label for="ubicacion" class="label py-1"><span class="label-text font-bold text-xs">Ubicación <span class="text-error">*</span></span></label>
          <input id="ubicacion" formControlName="ubicacion" type="text" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. San Miguel, El Salvador" title="Ubicación de la oferta" />
        </div>

        <div class="form-control">
          <label for="modalidadId" class="label py-1"><span class="label-text font-bold text-xs">Modalidad <span class="text-error">*</span></span></label>
          <select id="modalidadId" formControlName="modalidadId" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" title="Seleccione la modalidad de trabajo">
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="1">Presencial</option>
            <option value="2">Remoto</option>
            <option value="3">Híbrido</option>
          </select>
        </div>

        <div class="form-control md:col-span-2">
          <label for="descripcion" class="label py-1 flex justify-between">
            <span class="label-text font-bold text-xs">Descripción del Puesto <span class="text-error">*</span></span>
            <span class="label-text-alt text-base-content/50">Mín. 20 caracteres</span>
          </label>
          <textarea id="descripcion" formControlName="descripcion" minlength="20" class="textarea textarea-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 h-32" [class.textarea-error]="ofertaForm.get('descripcion')?.touched && ofertaForm.get('descripcion')?.invalid" placeholder="Describe las responsabilidades, el equipo y la misión del rol..." title="Descripción detallada del puesto"></textarea>
          <label class="label py-0 mt-1" *ngIf="ofertaForm.get('descripcion')?.touched && ofertaForm.get('descripcion')?.hasError('minlength')">
            <span class="label-text-alt text-error">
              Te faltan {{ 20 - (ofertaForm.get('descripcion')?.value?.length || 0) }} caracteres.
            </span>
          </label>
        </div>

        <div class="form-control md:col-span-2">
          <label for="requisitos" class="label py-1"><span class="label-text font-bold text-xs">Requisitos (Habilidades, Experiencia) <span class="text-error">*</span></span></label>
          <textarea id="requisitos" formControlName="requisitos" class="textarea textarea-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 h-24" placeholder="Ej. - 3 años de experiencia en .NET..." title="Requisitos del puesto"></textarea>
        </div>

        <div class="form-control">
          <label for="salarioMin" class="label py-1"><span class="label-text font-bold text-xs">Salario Mínimo (USD) <span class="text-error">*</span></span></label>
          <input id="salarioMin" formControlName="salarioMin" type="number" step="0.01" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. 600.00" title="Salario Mínimo" />
        </div>

        <div class="form-control">
          <label for="salarioMax" class="label py-1"><span class="label-text font-bold text-xs">Salario Máximo (USD) <span class="text-error">*</span></span></label>
          <input id="salarioMax" formControlName="salarioMax" type="number" step="0.01" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. 1000.00" title="Salario Máximo" />
          <label *ngIf="ofertaForm.hasError('rangoInvalido')" class="label py-1">
            <span class="label-text-alt text-error">El máximo debe ser mayor al mínimo</span>
          </label>
        </div>

        <div class="form-control md:col-span-2">
          <label for="fechaExpiracion" class="label py-1"><span class="label-text font-bold text-xs">Fecha de Expiración <span class="text-error">*</span></span></label>
          <input id="fechaExpiracion" formControlName="fechaExpiracion" type="date" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 w-full md:w-1/2" title="Fecha límite para aplicar" />
        </div>

        <div class="md:col-span-2 mt-6 flex justify-end gap-4 border-t border-base-200 pt-6">
          <button type="button" class="btn btn-ghost rounded-xl" routerLink="/dashboard/home">Cancelar</button>
          <button type="submit" class="btn btn-primary rounded-xl px-8 shadow-lg shadow-primary/30" [disabled]="ofertaForm.invalid || isLoading">
            <span *ngIf="isLoading" class="loading loading-spinner"></span>
            Publicar Vacante
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
