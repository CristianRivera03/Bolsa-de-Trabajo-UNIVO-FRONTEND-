<div class="p-6 md:p-10 max-w-4xl mx-auto animate-fade-in">
  
  <div class="flex items-center gap-3 mb-8 border-b border-base-200 pb-4">
    <span class="material-symbols-outlined text-primary text-3xl">post_add</span>
    <div>
      <h2 class="text-2xl font-bold text-base-content">Publicar Nueva Oferta</h2>
      <p class="text-xs text-base-content/60">Atrae al mejor talento de la Universidad de Oriente.</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl border border-base-200">
    <div class="card-body p-6 md:p-8">
      
      <div *ngIf="successMessage" class="alert alert-success bg-success/10 text-success-content border-none rounded-xl mb-6">
        <span class="material-symbols-outlined">check_circle</span>
        <span>{{ successMessage }}</span>
      </div>
      <div *ngIf="errorMessage" class="alert alert-error bg-error/10 text-error-content border-none rounded-xl mb-6">
        <span class="material-symbols-outlined">error</span>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="ofertaForm" (ngSubmit)="publicarOferta()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        
        <!-- Sección Principal -->
        <div class="form-control md:col-span-2 lg:col-span-3">
          <label for="titulo" class="label py-1"><span class="label-text font-bold text-xs">Título del Puesto <span class="text-error">*</span></span></label>
          <input id="titulo" formControlName="titulo" type="text" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. Desarrollador Angular Senior" />
        </div>

        <div class="form-control lg:col-span-2">
          <label for="ubicacion" class="label py-1"><span class="label-text font-bold text-xs">Dirección Detallada <span class="text-error">*</span></span></label>
          <input id="ubicacion" formControlName="ubicacion" type="text" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="Ej. Edificio B, Colonia Escalón" />
        </div>

        <div class="form-control">
          <label for="modalidadId" class="label py-1"><span class="label-text font-bold text-xs">Modalidad <span class="text-error">*</span></span></label>
          <select id="modalidadId" formControlName="modalidadId" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50">
            <option value="" disabled selected>Seleccione una opción</option>
            <option *ngFor="let mod of modalidades" [value]="mod.id">{{ mod.nombre }}</option>
          </select>
        </div>

        <!-- Ubicación: Departamento y Municipio -->
        <div class="form-control">
          <label for="departamentoId" class="label py-1"><span class="label-text font-bold text-xs">Departamento <span class="text-error">*</span></span></label>
          <select id="departamentoId" formControlName="departamentoId" (change)="onDepartamentoChange($event)" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50">
            <option value="" disabled selected>Seleccione un departamento</option>
            <option *ngFor="let dep of departamentos" [value]="dep.id">{{ dep.nombre }}</option>
          </select>
        </div>

        <div class="form-control">
          <label for="municipioId" class="label py-1"><span class="label-text font-bold text-xs">Municipio <span class="text-error">*</span></span></label>
          <select id="municipioId" formControlName="municipioId" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" [attr.disabled]="!municipios.length ? '' : null">
            <option value="" disabled selected>Seleccione un municipio</option>
            <option *ngFor="let mun of municipios" [value]="mun.id">{{ mun.nombre }}</option>
          </select>
        </div>

        <div class="form-control">
          <label for="tipoContratoId" class="label py-1"><span class="label-text font-bold text-xs">Tipo de Contrato <span class="text-error">*</span></span></label>
          <select id="tipoContratoId" formControlName="tipoContratoId" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50">
            <option value="" disabled selected>Seleccione un contrato</option>
            <option *ngFor="let contrato of contratos" [value]="contrato.id">{{ contrato.nombre }}</option>
          </select>
        </div>

        <!-- Detalles Generales -->
        <div class="form-control">
          <label for="vacantes" class="label py-1"><span class="label-text font-bold text-xs">Número de Vacantes <span class="text-error">*</span></span></label>
          <input id="vacantes" formControlName="vacantes" type="number" min="1" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" />
        </div>

        <div class="form-control">
          <label for="generoId" class="label py-1"><span class="label-text font-bold text-xs">Género Preferido</span></label>
          <select id="generoId" formControlName="generoId" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50">
            <option *ngFor="let genero of generos" [value]="genero.id">{{ genero.nombre }}</option>
          </select>
        </div>

        <div class="form-control">
          <label for="fechaExpiracion" class="label py-1"><span class="label-text font-bold text-xs">Fecha de Expiración</span></label>
          <input id="fechaExpiracion" formControlName="fechaExpiracion" type="date" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" />
        </div>

        <!-- Rangos: Salario y Edad -->
        <div class="form-control">
          <label for="salarioMin" class="label py-1"><span class="label-text font-bold text-xs">Salario Min (USD)</span></label>
          <input id="salarioMin" formControlName="salarioMin" type="number" step="0.01" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="600.00" />
        </div>

        <div class="form-control">
          <label for="salarioMax" class="label py-1"><span class="label-text font-bold text-xs">Salario Max (USD)</span></label>
          <input id="salarioMax" formControlName="salarioMax" type="number" step="0.01" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" placeholder="1000.00" />
          <label *ngIf="ofertaForm.hasError('rangoInvalido')" class="label py-1">
            <span class="label-text-alt text-error">El máximo debe ser mayor al mínimo</span>
          </label>
        </div>
        
        <div class="form-control hidden lg:block"></div> <!-- Placeholder for grid -->

        <div class="form-control">
          <label for="edadMin" class="label py-1"><span class="label-text font-bold text-xs">Edad Mínima</span></label>
          <input id="edadMin" formControlName="edadMin" type="number" min="18" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" />
        </div>

        <div class="form-control">
          <label for="edadMax" class="label py-1"><span class="label-text font-bold text-xs">Edad Máxima</span></label>
          <input id="edadMax" formControlName="edadMax" type="number" class="input input-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50" />
        </div>

        <!-- Licencias y Vehículo -->
        <div class="form-control">
          <label for="licenciaId" class="label py-1"><span class="label-text font-bold text-xs">Tipo de Licencia</span></label>
          <select id="licenciaId" formControlName="licenciaId" class="select select-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50">
            <option [ngValue]="null">Ninguna requerida</option>
            <option *ngFor="let lic of licencias" [value]="lic.id">{{ lic.nombre }}</option>
          </select>
        </div>

        <div class="form-control flex justify-center mt-6">
          <label class="cursor-pointer label flex gap-4 justify-start">
            <input type="checkbox" formControlName="tieneVehiculo" class="toggle toggle-primary" />
            <span class="label-text font-bold text-sm">¿Requiere vehículo propio?</span>
          </label>
        </div>

        <!-- Descripciones Largas -->
        <div class="form-control md:col-span-2 lg:col-span-3 mt-4">
          <label for="descripcion" class="label py-1 flex justify-between">
            <span class="label-text font-bold text-xs">Descripción del Puesto <span class="text-error">*</span></span>
            <span class="label-text-alt text-base-content/50">Mín. 20 caracteres</span>
          </label>
          <textarea id="descripcion" formControlName="descripcion" minlength="20" class="textarea textarea-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 h-32" [class.textarea-error]="ofertaForm.get('descripcion')?.touched && ofertaForm.get('descripcion')?.invalid" placeholder="Describe las responsabilidades, el equipo y la misión del rol..."></textarea>
          <label class="label py-0 mt-1" *ngIf="ofertaForm.get('descripcion')?.touched && ofertaForm.get('descripcion')?.hasError('minlength')">
            <span class="label-text-alt text-error">
              Te faltan {{ 20 - (ofertaForm.get('descripcion')?.value?.length || 0) }} caracteres.
            </span>
          </label>
        </div>

        <div class="form-control md:col-span-2 lg:col-span-3">
          <label for="requisitos" class="label py-1"><span class="label-text font-bold text-xs">Requisitos Adicionales <span class="text-error">*</span></span></label>
          <textarea id="requisitos" formControlName="requisitos" class="textarea textarea-bordered bg-base-100 rounded-xl focus:ring-2 focus:ring-primary/50 h-24" placeholder="Ej. - 3 años de experiencia en .NET..."></textarea>
        </div>

        <div class="md:col-span-2 lg:col-span-3 mt-6 flex justify-end gap-4 border-t border-base-200 pt-6">
          <button type="button" class="btn btn-ghost rounded-xl" routerLink="/dashboard/home">Cancelar</button>
          <button type="submit" class="btn btn-primary rounded-xl px-8 shadow-lg shadow-primary/30" [disabled]="ofertaForm.invalid || isLoading">
            <span *ngIf="isLoading" class="loading loading-spinner"></span>
            Publicar Vacante
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
