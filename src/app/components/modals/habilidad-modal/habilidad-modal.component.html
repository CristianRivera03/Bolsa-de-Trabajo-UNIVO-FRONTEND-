<dialog id="modal_habilidad" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box sm:w-11/12 sm:max-w-md bg-base-100 overflow-visible">
    
    <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="cerrar()">✕</button>

    <h3 class="font-bold text-xl text-primary border-b pb-2 mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined">bolt</span>
      @if (habilidadIdActual) {
        Editar Habilidad
      } @else {
        Agregar Habilidad
      }
    </h3>

    <form [formGroup]="habilidadForm" (ngSubmit)="guardar()">
      <div class="flex flex-col gap-4">
        
        <div class="form-control relative">
          <!-- Backdrop to close dropdown -->
          <div *ngIf="isOpen" class="fixed inset-0 z-40" (click)="isOpen = false"></div>

          <label class="label relative z-10"><span class="label-text font-medium">Habilidad</span></label>
          <input type="text"
                 class="input input-bordered w-full relative z-50 cursor-pointer"
                 [value]="searchQuery"
                 (input)="onSearch($event)"
                 (focus)="isOpen = true"
                 placeholder="Escriba para buscar o seleccione..."
                 [disabled]="habilidadForm.get('habilidadTexto')?.disabled" />
                 
          <!-- Custom Dropdown List -->
          <div *ngIf="isOpen && !habilidadForm.get('habilidadTexto')?.disabled" 
               class="absolute left-0 top-[76px] w-full bg-base-100 border border-base-300 rounded-lg shadow-2xl z-50 max-h-56 overflow-y-auto custom-scrollbar">
            <ul class="menu menu-sm w-full p-1.5 gap-0.5">
              <li *ngIf="filteredHabilidades.length === 0">
                <span class="text-base-content/50 italic py-2">No se encontraron habilidades</span>
              </li>
              <li *ngFor="let hab of filteredHabilidades">
                <a (click)="seleccionarHabilidad(hab.nombre)" class="font-medium hover:bg-primary/10 hover:text-primary rounded-md py-2">
                  {{hab.nombre}}
                </a>
              </li>
            </ul>
          </div>

          @if (habilidadForm.get('habilidadTexto')?.disabled) {
            <span class="label-text-alt text-base-content/60 mt-1 relative z-10">Para cambiar la habilidad, elimínela y cree una nueva.</span>
          }
        </div>

        <div class="form-control mt-2">
          <label class="label pb-0">
            <span class="label-text font-medium">Nivel de Dominio</span>
            <span class="badge badge-primary">{{ habilidadForm.get('nivelDominio')?.value }}/5</span>
          </label>
          <input type="range" min="1" max="5" formControlName="nivelDominio" class="range range-primary mt-2" step="1" />
          <div class="w-full flex justify-between text-xs px-2 mt-2 text-base-content/50">
            <span>Básico</span>
            <span>Intermedio</span>
            <span>Avanzado</span>
            <span>Experto</span>
          </div>
        </div>

      </div>

      <div class="modal-action mt-6 border-t pt-4">
        <button type="button" class="btn btn-ghost" (click)="cerrar()" [disabled]="isLoading">Cancelar</button>
        <button type="submit" class="btn btn-primary min-w-[120px]" [disabled]="habilidadForm.invalid || isLoading">
          @if (isLoading) {
            <span class="loading loading-spinner loading-sm"></span> Guardando...
          } @else {
            <span class="material-symbols-outlined text-[20px]">save</span> Guardar
          }
        </button>
      </div>

    </form>
  </div>
  
  <form method="dialog" class="modal-backdrop">
    <button (click)="cerrar()">cerrar</button>
  </form>
</dialog>
