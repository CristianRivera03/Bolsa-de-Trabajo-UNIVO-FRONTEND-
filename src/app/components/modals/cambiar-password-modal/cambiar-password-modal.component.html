<dialog id="cambiar_password_modal" class="modal">
  <div class="modal-box w-11/12 max-w-md bg-base-100">
    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">lock_reset</span>
      Cambiar Contraseña
    </h3>
    
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="form-control w-full mb-3">
        <label class="label">
          <span class="label-text font-medium">Contraseña Actual</span>
        </label>
        <div class="relative">
          <input 
            [type]="showCurrentPassword ? 'text' : 'password'" 
            formControlName="currentPassword"
            placeholder="Ingresa tu contraseña actual" 
            class="input input-bordered w-full pr-10"
            [ngClass]="{'input-error': passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched}"
          />
          <button type="button" class="absolute inset-y-0 right-3 flex items-center text-base-content/50 hover:text-base-content" (click)="showCurrentPassword = !showCurrentPassword" tabindex="-1">
            <span class="material-symbols-outlined text-[20px]">{{ showCurrentPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <label class="label" *ngIf="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched">
          <span class="label-text-alt text-error">Este campo es requerido.</span>
        </label>
      </div>

      <div class="form-control w-full mb-3">
        <label class="label">
          <span class="label-text font-medium">Nueva Contraseña</span>
        </label>
        <div class="relative">
          <input 
            [type]="showNewPassword ? 'text' : 'password'" 
            formControlName="newPassword"
            placeholder="Mínimo 6 caracteres" 
            class="input input-bordered w-full pr-10"
            [ngClass]="{'input-error': passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched}"
          />
          <button type="button" class="absolute inset-y-0 right-3 flex items-center text-base-content/50 hover:text-base-content" (click)="showNewPassword = !showNewPassword" tabindex="-1">
            <span class="material-symbols-outlined text-[20px]">{{ showNewPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <label class="label" *ngIf="passwordForm.get('newPassword')?.errors?.['required'] && passwordForm.get('newPassword')?.touched">
          <span class="label-text-alt text-error">Este campo es requerido.</span>
        </label>
        <label class="label" *ngIf="passwordForm.get('newPassword')?.errors?.['minlength'] && passwordForm.get('newPassword')?.touched">
          <span class="label-text-alt text-error">Debe tener al menos 6 caracteres.</span>
        </label>
      </div>

      <div class="form-control w-full mb-5">
        <label class="label">
          <span class="label-text font-medium">Confirmar Nueva Contraseña</span>
        </label>
        <div class="relative">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            formControlName="confirmPassword"
            placeholder="Repite la nueva contraseña" 
            class="input input-bordered w-full pr-10"
            [ngClass]="{'input-error': (passwordForm.get('confirmPassword')?.invalid || passwordForm.hasError('mismatch')) && passwordForm.get('confirmPassword')?.touched}"
          />
          <button type="button" class="absolute inset-y-0 right-3 flex items-center text-base-content/50 hover:text-base-content" (click)="showConfirmPassword = !showConfirmPassword" tabindex="-1">
            <span class="material-symbols-outlined text-[20px]">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <label class="label" *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched">
          <span class="label-text-alt text-error">Las contraseñas no coinciden.</span>
        </label>
      </div>

      <div class="modal-action mt-6 flex gap-2">
        <button type="button" class="btn btn-ghost" (click)="closeModal()" [disabled]="isLoading">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="passwordForm.invalid || isLoading">
          <span *ngIf="isLoading" class="loading loading-spinner loading-sm"></span>
          Actualizar Contraseña
        </button>
      </div>
    </form>
    
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="closeModal()" [disabled]="isLoading">✕</button>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button (click)="closeModal()" [disabled]="isLoading">Cerrar</button>
  </form>
</dialog>
