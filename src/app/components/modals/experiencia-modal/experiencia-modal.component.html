<dialog id="modal_experiencia" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box sm:w-11/12 sm:max-w-2xl bg-base-100">
    
    <button type="button" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="cerrar()">✕</button>

    <h3 class="font-bold text-xl text-primary border-b pb-2 mb-4 flex items-center gap-2">
      <span class="material-symbols-outlined">work</span>
      @if (experienciaIdActual) {
        Editar Experiencia
      } @else {
        Agregar Experiencia
      }
    </h3>

    <form [formGroup]="experienciaForm" (ngSubmit)="guardar()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <div class="form-control md:col-span-2">
          <label class="label"><span class="label-text font-medium">Cargo o Puesto</span></label>
          <input type="text" formControlName="cargo" class="input input-bordered w-full" placeholder="Ej. Tecnico de Soporte , Cajero , Maestro" />
        </div>

        <div class="form-control md:col-span-2">
          <label class="label"><span class="label-text font-medium">Empresa o Institución</span></label>
          <input type="text" formControlName="empresa" class="input input-bordered w-full" placeholder="Ej. Empresa XYZ , Instituto ABC" />
        </div>

        <div class="form-control md:col-span-2 mt-2 bg-base-200 p-3 rounded-lg">
          <label class="cursor-pointer label justify-start gap-4">
            <input type="checkbox" formControlName="esTrabajoActual" class="checkbox checkbox-primary" />
            <span class="label-text font-bold">Actualmente trabajo aquí</span>
          </label>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Fecha de Inicio</span></label>
          <input type="date" formControlName="fechaInicio" class="input input-bordered w-full" />
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text font-medium">Fecha de Fin</span></label>
          <input type="date" formControlName="fechaFin" class="input input-bordered w-full" 
                 [class.opacity-50]="experienciaForm.get('esTrabajoActual')?.value" />
        </div>

        <div class="form-control md:col-span-2">
          <label class="label">
            <span class="label-text font-medium">Descripción de responsabilidades y logros</span>
          </label>
          <textarea formControlName="descripcionPuesto" class="textarea textarea-bordered h-28 leading-tight" 
                    placeholder="Describe tus tareas principales, tecnologías que usaste y metas logradas..."></textarea>
        </div>

      </div>

      <div class="modal-action mt-6 border-t pt-4">
        <button type="button" class="btn btn-ghost" (click)="cerrar()" [disabled]="isLoading">Cancelar</button>
        <button type="submit" class="btn btn-primary min-w-[120px]" [disabled]="experienciaForm.invalid || isLoading">
          @if (isLoading) {
            <span class="loading loading-spinner loading-sm"></span> Guardando...
          } @else {
            <span class="material-symbols-outlined text-[20px]">save</span> Guardar
          }
        </button>
      </div>

    </form>
  </div>
  
  <form method="dialog" class="modal-backdrop">
    <button (click)="cerrar()">cerrar</button>
  </form>
</dialog>
